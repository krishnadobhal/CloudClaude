worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;

events {
    worker_connections 256;
}

http {
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_x_cloudclaude_proof $proof_id {
        default 0;
        "~^[0-9a-f]{32}$" $http_x_cloudclaude_proof;
    }
    map $upstream_http_x_cpa_trace_id $safe_trace {
        default "-";
        "~^[0-9]{14}-[0-9a-f]{16}-[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$" $upstream_http_x_cpa_trace_id;
    }
    map $uri $proof_route {
        default blocked;
        /healthz health;
        /v1/models models;
        /v1/messages messages;
        /v1/messages/count_tokens count_tokens;
    }
    map $http_x_cloudclaude_account $backend {
        default "";
        work http://gateway-work:8317;
        personal http://gateway-personal:8317;
    }
    log_format proof '$time_iso8601 proof=$proof_id route=$proof_route status=$status trace=$safe_trace';
    access_log /dev/stdout proof if=$proof_id;

    server {
        listen 8318;
        server_tokens off;
        client_max_body_size 32m;
        gzip off;

        # Resolve through Docker DNS again after a gateway container is replaced.
        resolver 127.0.0.11 valid=5s ipv6=off;
        if ($backend = "") { return 404; }
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-CloudClaude-Proof "";
        proxy_set_header X-CloudClaude-Account "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_next_upstream off;

        location = /healthz { proxy_pass $backend$uri$is_args$args; }
        location = /v1/models { proxy_pass $backend$uri$is_args$args; }
        location = /v1/messages { proxy_pass $backend$uri$is_args$args; }
        location = /v1/messages/count_tokens { proxy_pass $backend$uri$is_args$args; }
        location / { return 404; }
    }
}
