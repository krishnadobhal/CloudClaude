name: cloudclaude

x-gateway: &gateway
    image: docker.io/eceasy/cli-proxy-api:v8.1.3@sha256:784019627af9654e5d595aa74b6bdeb819c5a2a6f9ebade5461dcf2a8ba65d3a
    command: ["./CLIProxyAPI", "-config", "/CLIProxyAPI/config.yaml", "-local-model"]
    environment:
      MANAGEMENT_PASSWORD: ""
      TZ: UTC
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: none
    restart: unless-stopped

services:
  gateway-work:
    <<: *gateway
    volumes:
      - type: bind
        source: /etc/cloudclaude/work.yaml
        target: /CLIProxyAPI/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/cloudclaude/oauth/work
        target: /var/lib/cloudclaude/oauth
        bind:
          create_host_path: false

  gateway-personal:
    <<: *gateway
    profiles: [personal]
    volumes:
      - type: bind
        source: /etc/cloudclaude/personal.yaml
        target: /CLIProxyAPI/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/cloudclaude/oauth/personal
        target: /var/lib/cloudclaude/oauth
        bind:
          create_host_path: false

  ingress:
    image: docker.io/library/nginx:1.30.8-alpine@sha256:6437a63b5c529f0e06162b3f593c0154cff6fa2ea0f94fd7c27928cb399e022d
    entrypoint: [nginx]
    command: ["-g", "daemon off;"]
    user: "101:101"
    depends_on: [gateway-work]
    ports:
      - "127.0.0.1:8317:8318"
    volumes:
      - type: bind
        source: /etc/cloudclaude/ingress.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options:
        max-size: "2m"
        max-file: "2"
    restart: unless-stopped
